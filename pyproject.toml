[project]
name = "ha-nature-remo"
version = "0.1.0"
description = "Home Assistant用のNature Remoカスタム連携"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "homeassistant==2026.10.1",
    "mypy>=2.4.0",
    "pytest-homeassistant-custom-component==0.13.372",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "ASYNC",
    "PT",
    "PL",
    "TC",
    "N",
    "C4",
    "PIE",
    "RET",
    "D",
]
ignore = [
    # 日本語のdocstringに英文前提の規則が合わないため
    "D400",
    "D415",
    "PLR2004",
    "PLR0913",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-self", "truthy-bool"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
