name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # setup-pythonで入れたPythonを使い、uvが別の版をダウンロードしないようにする
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v7
      # uv 0.7.2はPython 3.14の正式版を配布物として知らず、アルファ版を取得してしまうため、Pythonはsetup-pythonで入れる
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # uv.lockを生成したuvと揃え、--lockedがuvの版の違いで失敗しないようにする
          version: "0.7.2"
          enable-cache: true
      - name: 依存をインストール
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest
